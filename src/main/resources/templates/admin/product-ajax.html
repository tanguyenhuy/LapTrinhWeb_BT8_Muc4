<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Product</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="fw-bold text-success"><i class="bi bi-box-seam me-2"></i>Quản lý Sản Phẩm</h3>
        <div>
            <a href="/admin/category-ajax" class="btn btn-outline-secondary me-2">Qua trang Danh mục</a>
            <button class="btn btn-primary" onclick="openAddProductModal()">
                <i class="bi bi-plus-circle me-1"></i> Thêm Sản Phẩm
            </button>
        </div>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <table class="table table-hover table-bordered align-middle mb-0" id="productTable">
                <thead class="table-dark">
                    <tr>
                        <th style="width: 5%;">ID</th>
                        <th style="width: 10%;" class="text-center">Hình ảnh</th>
                        <th style="width: 25%;">Tên sản phẩm</th>
                        <th style="width: 15%;">Danh mục</th>
                        <th style="width: 15%;">Giá</th>
                        <th style="width: 10%;">Số lượng</th>
                        <th style="width: 20%;" class="text-center">Thao tác</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
        </div>
    </div>

    <div class="modal fade" id="productModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <form id="productForm" enctype="multipart/form-data">
                    <div class="modal-header">
                        <h5 class="modal-title" id="productModalTitle">Thêm Sản Phẩm</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="pro_id" name="productId">
                        
                        <div class="row">
                            <div class="col-md-8 mb-3">
                                <label class="form-label">Tên sản phẩm <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="pro_name" name="productName" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Danh mục <span class="text-danger">*</span></label>
                                <select class="form-select" id="pro_category" name="categoryId" required>
                                </select>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Giá (VNĐ) <span class="text-danger">*</span></label>
                                <input type="number" step="0.01" class="form-control" id="pro_price" name="unitPrice" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Số lượng <span class="text-danger">*</span></label>
                                <input type="number" class="form-control" id="pro_quantity" name="quantity" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Giảm giá (%)</label>
                                <input type="number" step="0.01" class="form-control" id="pro_discount" name="discount" value="0">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Trạng thái</label>
                                <select class="form-select" id="pro_status" name="status">
                                    <option value="1">Đang kinh doanh</option>
                                    <option value="0">Ngừng kinh doanh</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Chọn hình ảnh</label>
                                <input type="file" class="form-control" name="imageFile" accept="image/*">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Mô tả chi tiết</label>
                            <textarea class="form-control" rows="3" id="pro_desc" name="description"></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                        <button type="submit" class="btn btn-primary" id="btnSaveProduct">Lưu</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let isEdit = false;

        function loadCategoryDropdown(selectedId = null) {
            $.ajax({
                url: '/api/category',
                type: 'GET',
                success: function(res) {
                    if (res.status) {
                        let opts = '<option value="">-- Chọn danh mục --</option>';
                        res.body.forEach(c => {
                            let sel = (selectedId && selectedId === c.categoryId) ? 'selected' : '';
                            opts += `<option value="${c.categoryId}" ${sel}>${c.categoryName}</option>`;
                        });
                        $('#pro_category').html(opts);
                    }
                }
            });
        }

        function loadProducts() {
            $.ajax({
                url: '/api/product',
                type: 'GET',
                success: function(res) {
                    let rows = '';
                    if (res.status && res.body.length > 0) {
                        res.body.forEach(p => {
                            let imgSrc = p.images ? '/uploads/' + p.images : 'https://placehold.co/60x60?text=No+Img';
                            let catName = p.category ? p.category.categoryName : 'Chưa gán';
                            rows += `
                                <tr>
                                    <td class="fw-bold">${p.productId}</td>
                                    <td class="text-center">
                                        <img src="${imgSrc}" class="rounded border" style="width: 50px; height: 50px; object-fit: cover;">
                                    </td>
                                    <td class="fw-semibold">${p.productName}</td>
                                    <td><span class="badge bg-info text-dark">${catName}</span></td>
                                    <td class="text-danger fw-bold">${Number(p.unitPrice).toLocaleString()} đ</td>
                                    <td>${p.quantity}</td>
                                    <td class="text-center">
                                        <button class="btn btn-warning btn-sm me-1" onclick="openEditProduct(${p.productId})">
                                            <i class="bi bi-pencil"></i> Sửa
                                        </button>
                                        <button class="btn btn-danger btn-sm" onclick="deleteProduct(${p.productId})">
                                            <i class="bi bi-trash"></i> Xóa
                                        </button>
                                    </td>
                                </tr>
                            `;
                        });
                    } else {
                        rows = '<tr><td colspan="7" class="text-center text-muted py-3">Chưa có sản phẩm nào.</td></tr>';
                    }
                    $('#productTable tbody').html(rows);
                }
            });
        }
        function openAddProductModal() {
            isEdit = false;
            $('#productModalTitle').text('Thêm Sản Phẩm Mới');
            $('#btnSaveProduct').text('Thêm Mới');
            $('#productForm')[0].reset();
            $('#pro_id').val('');
            loadCategoryDropdown();
            $('#productModal').modal('show');
        }

        function openEditProduct(id) {
            isEdit = true;
            $('#productModalTitle').text('Cập Nhật Sản Phẩm ID: ' + id);
            $('#btnSaveProduct').text('Lưu Cập Nhật');
            
            $.ajax({
                url: '/api/product/' + id,
                type: 'GET',
                success: function(res) {
                    if (res.status) {
                        let p = res.body;
                        $('#pro_id').val(p.productId);
                        $('#pro_name').val(p.productName);
                        $('#pro_price').val(p.unitPrice);
                        $('#pro_quantity').val(p.quantity);
                        $('#pro_discount').val(p.discount);
                        $('#pro_status').val(p.status);
                        $('#pro_desc').val(p.description);
                        loadCategoryDropdown(p.category ? p.category.categoryId : null);
                        $('#productModal').modal('show');
                    }
                }
            });
        }

        $('#productForm').submit(function(e) {
            e.preventDefault();
            let formData = new FormData(this);
            let url = isEdit ? '/api/product/updateProduct' : '/api/product/addProduct';
            let method = isEdit ? 'PUT' : 'POST';

            $.ajax({
                url: url,
                type: method,
                data: formData,
                contentType: false,
                processData: false,
                success: function(res) {
                    if (res.status) {
                        $('#productModal').modal('hide');
                        $('#productForm')[0].reset();
                        loadProducts();
                    } else {
                        alert(res.message);
                    }
                },
                error: function(err) { alert('Thao tác thất bại!'); }
            });
        });

        function deleteProduct(id) {
            if (confirm('Bạn có chắc chắn muốn xóa sản phẩm ID: ' + id + '?')) {
                $.ajax({
                    url: '/api/product/deleteProduct?productId=' + id,
                    type: 'DELETE',
                    success: function(res) {
                        if (res.status) { loadProducts(); }
                        else { alert(res.message); }
                    }
                });
            }
        }

        $(document).ready(function() {
            loadProducts();
        });
    </script>
</body>
</html>
